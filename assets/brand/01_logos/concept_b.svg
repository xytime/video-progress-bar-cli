<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="spiralGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D0" />
      <stop offset="40%" stop-color="#F3BA2F" />
      <stop offset="100%" stop-color="#8C6314" />
    </linearGradient>

    <linearGradient id="spiralCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#E0FFFF" />
    </linearGradient>

    <radialGradient id="pupilAuraB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#00F0FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <filter id="bloomB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="9.0" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0D1117" rx="61.44"/>

  <!-- ================= 0. Mathematical Graticules ================= -->
  <circle cx="256.0" cy="256.0" r="210.0" fill="none" stroke="#30363D" stroke-width="1.5" stroke-opacity="0.7" />
  <circle cx="256.0" cy="256.0" r="160.0" fill="none" stroke="#21262D" stroke-width="1.0" stroke-dasharray="4.0 6.0" />
  <circle cx="256.0" cy="256.0" r="110.0" fill="none" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.3" />

  <!-- Subtly Piercing Crosshairs -->
  <line x1="36.0" y1="256.0" x2="476.0" y2="256.0" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.5" stroke-dasharray="3.0 5.0" />
  <line x1="256.0" y1="36.0" x2="256.0" y2="476.0" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.5" stroke-dasharray="3.0 5.0" />

  <!-- ================= 1. Twin Interlocking Fibonacci Spiral Eye ================= -->
  <!-- Upper Golden Spiral Arc (The Dragon Crest / Call Volatility) -->
  <path d="M 76.0 256.0
           C 76.0 136.0, 206.0 106.0, 296.0 106.0
           C 376.0 106.0, 436.0 166.0, 436.0 256.0
           C 436.0 316.0, 386.0 356.0, 316.0 356.0
           C 246.0 356.0, 196.0 316.0, 196.0 256.0
           C 196.0 221.0, 221.0 201.0, 256.0 201.0
           C 281.0 201.0, 296.0 226.0, 296.0 256.0"
        fill="none" stroke="url(#spiralGold)" stroke-width="3.5" stroke-linecap="round" filter="url(#bloomB)" />

  <!-- Lower Cyan Spiral Arc (The Dragon Eye / Put Volatility) -->
  <path d="M 436.0 256.0
           C 436.0 376.0, 306.0 406.0, 216.0 406.0
           C 136.0 406.0, 76.0 346.0, 76.0 256.0
           C 76.0 196.0, 126.0 156.0, 196.0 156.0
           C 266.0 156.0, 316.0 196.0, 316.0 256.0
           C 316.0 291.0, 291.0 311.0, 256.0 311.0
           C 231.0 311.0, 216.0 286.0, 216.0 256.0"
        fill="none" stroke="url(#spiralCyan)" stroke-width="3.5" stroke-linecap="round" filter="url(#bloomB)" />

  <!-- ================= 2. Center Singularity Pupil ================= -->
  <circle cx="256.0" cy="256.0" r="46.0" fill="url(#pupilAuraB)" />
  <circle cx="256.0" cy="256.0" r="28.0" fill="#0A0E14" stroke="#30363D" stroke-width="2.0" />
  <circle cx="256.0" cy="256.0" r="20.0" fill="none" stroke="url(#spiralCyan)" stroke-width="2.0" filter="url(#bloomB)" />
  <circle cx="256.0" cy="256.0" r="8.0" fill="#FFFFFF" />
  <circle cx="256.0" cy="256.0" r="3.5" fill="#00F0FF" />
</svg>