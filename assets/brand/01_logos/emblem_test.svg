<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master Metallic Gold Gradient -->
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#F3BA2F" />
      <stop offset="85%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#996F1D" />
    </linearGradient>

    <!-- Master Cyan Laser Gradient -->
    <linearGradient id="emblemCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#E6FFFF" />
    </linearGradient>

    <!-- Dark Titanium Facet Gradient -->
    <linearGradient id="darkTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262F3D" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <radialGradient id="pupilAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <filter id="neonBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6.0" result="blur1" />
      <feGaussianBlur stdDeviation="14.0" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.0" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0D1117" rx="61.44"/>

  <!-- ================= 0. Outer Quantitative Radar Matrix ================= -->
  <!-- Circular Coordinate Ring -->
  <circle cx="256.0" cy="256.0" r="216.0" fill="none" stroke="#30363D" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="256.0" cy="256.0" r="188.0" fill="none" stroke="#21262D" stroke-width="1.0" stroke-dasharray="4.0 8.0" />
  
  <!-- Subtle Graticule Ticks -->
  <line x1="32.0" y1="256.0" x2="480.0" y2="256.0" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.4" stroke-dasharray="3.0 6.0" />
  <line x1="256.0" y1="32.0" x2="256.0" y2="480.0" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.4" stroke-dasharray="3.0 6.0" />

  <!-- Four Golden Cardinal Marks (π/2, π, 3π/2, 2π) -->
  <polygon points="256.0,40.0 252.0,30.0 260.0,30.0" fill="url(#emblemGold)" />
  <polygon points="256.0,472.0 252.0,482.0 260.0,482.0" fill="url(#emblemGold)" />
  <polygon points="40.0,256.0 30.0,252.0 30.0,260.0" fill="url(#emblemGold)" />
  <polygon points="472.0,256.0 482.0,252.0 482.0,260.0" fill="url(#emblemGold)" />

  <!-- ================= 1. The Dragon Momentum Fins (四向动量龙翼流线) ================= -->
  <!-- Top-Right Ascending Dragon Wing (Gold + Titanium) -->
  <path d="M 316.0 146.0
           L 416.0 81.0
           L 366.0 171.0
           L 431.0 181.0
           L 341.0 211.0 Z"
        fill="url(#emblemGold)" filter="url(#softGlow)" opacity="0.95" />

  <path d="M 306.0 161.0
           L 396.0 106.0
           L 356.0 181.0 Z"
        fill="url(#darkTitanium)" stroke="#30363D" stroke-width="1.0" />

  <!-- Bottom-Left Counter Dragon Wing (Cyan + Titanium) -->
  <path d="M 196.0 366.0
           L 96.0 431.0
           L 146.0 341.0
           L 81.0 331.0
           L 171.0 301.0 Z"
        fill="url(#emblemCyan)" filter="url(#softGlow)" opacity="0.95" />

  <path d="M 206.0 351.0
           L 116.0 406.0
           L 156.0 331.0 Z"
        fill="url(#darkTitanium)" stroke="#30363D" stroke-width="1.0" />

  <!-- Top-Left & Bottom-Right Supporting Aerodynamic Vanes -->
  <path d="M 171.0 211.0 L 106.0 146.0 L 196.0 166.0 Z" fill="url(#darkTitanium)" stroke="url(#emblemGold)" stroke-width="1.5" />
  <path d="M 341.0 301.0 L 406.0 366.0 L 316.0 346.0 Z" fill="url(#darkTitanium)" stroke="url(#emblemCyan)" stroke-width="1.5" />

  <!-- ================= 2. The Volatility Lens / Probability Eye (波动率之眸) ================= -->
  <!-- Outer Dark Titanium Eye Hull -->
  <path d="M 86.0 256.0
           C 166.0 151.0, 346.0 151.0, 426.0 256.0
           C 346.0 361.0, 166.0 361.0, 86.0 256.0 Z"
        fill="url(#darkTitanium)" stroke="#30363D" stroke-width="3.0" />

  <!-- Upper Call Volatility Smile Arch (Radiant Gold) -->
  <path d="M 96.0 256.0
           C 176.0 164.0, 336.0 164.0, 416.0 256.0"
        fill="none" stroke="url(#emblemGold)" stroke-width="5.0" stroke-linecap="round" filter="url(#softGlow)" />

  <!-- Lower Put Volatility Smile Arch (Radiant Cyan) -->
  <path d="M 96.0 256.0
           C 176.0 348.0, 336.0 348.0, 416.0 256.0"
        fill="none" stroke="url(#emblemCyan)" stroke-width="5.0" stroke-linecap="round" filter="url(#neonBloom)" />

  <!-- Inner Gaussian Sub-arcs (微积分概率密度分布线) -->
  <path d="M 136.0 256.0 C 196.0 206.0, 316.0 206.0, 376.0 256.0"
        fill="none" stroke="#F3BA2F" stroke-width="1.5" stroke-dasharray="3.0 4.0" opacity="0.6" />
  <path d="M 136.0 256.0 C 196.0 306.0, 316.0 306.0, 376.0 256.0"
        fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3.0 4.0" opacity="0.6" />

  <!-- ================= 3. The Quantum Singularity Pupil (Delta 0.50 价格引力核心) ================= -->
  <!-- Ambient Core Glow -->
  <circle cx="256.0" cy="256.0" r="54.0" fill="url(#pupilAura)" />

  <!-- Titanium Orbit Shell -->
  <circle cx="256.0" cy="256.0" r="40.0" fill="#0A0E14" stroke="#30363D" stroke-width="2.0" />
  
  <!-- Outer GEX Laser Ring -->
  <circle cx="256.0" cy="256.0" r="32.0" fill="none" stroke="url(#emblemCyan)" stroke-width="3.0" filter="url(#neonBloom)" />
  <circle cx="256.0" cy="256.0" r="22.0" fill="none" stroke="url(#emblemGold)" stroke-width="1.5" stroke-dasharray="2.0 4.0" />

  <!-- Center Pure Singularity Photon -->
  <circle cx="256.0" cy="256.0" r="11.0" fill="#0D1117" stroke="#FFFFFF" stroke-width="2.0" />
  <circle cx="256.0" cy="256.0" r="5.0" fill="#00F0FF" filter="url(#softGlow)" />

  <!-- 45° Momentum Vector Piercing Ray (突破动量箭头) -->
  <line x1="151.0" y1="361.0" x2="371.0" y2="141.0"
        stroke="url(#emblemCyan)" stroke-width="2.5" stroke-linecap="round" filter="url(#neonBloom)" />
  <polygon points="371.0,141.0 348.0,146.0 366.0,164.0"
           fill="#00F0FF" filter="url(#neonBloom)" />
</svg>