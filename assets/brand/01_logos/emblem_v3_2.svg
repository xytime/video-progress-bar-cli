<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master Metallic 24K Gold Gradient -->
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="30%" stop-color="#F3BA2F" />
      <stop offset="75%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#996E1D" />
    </linearGradient>

    <!-- Master Cyan Laser Gradient -->
    <linearGradient id="emblemCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="45%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#E0FFFF" />
    </linearGradient>

    <!-- Bi-Color Transition Gradient for Main Lens -->
    <linearGradient id="lensBiColor" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3BA2F" />
    </linearGradient>

    <radialGradient id="singularityAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <filter id="bloomNeon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.0" result="blur1" />
      <feGaussianBlur stdDeviation="12.0" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softLaser" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.0" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0D1117" rx="61.44"/>

  <!-- ================= 1. Background Quantitative Radar Framework ================= -->
  <!-- Outer Precision Calibration Track -->
  <circle cx="256.0" cy="256.0" r="210.0" fill="none" stroke="#30363D" stroke-width="1.5" stroke-opacity="0.7" />
  <circle cx="256.0" cy="256.0" r="185.0" fill="none" stroke="#21262D" stroke-width="1.0" stroke-dasharray="4.0 8.0" />
  <circle cx="256.0" cy="256.0" r="145.0" fill="none" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.4" stroke-dasharray="2.0 6.0" />

  <!-- Coordinate Crosshairs (微观极坐标基准轴) -->
  <line x1="36.0" y1="256.0" x2="476.0" y2="256.0" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.5" stroke-dasharray="4.0 6.0" />
  <line x1="256.0" y1="36.0" x2="256.0" y2="476.0" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.5" stroke-dasharray="4.0 6.0" />

  <!-- Cardinal Precision Diamond Nodes (四向黄金奇点标) -->
  <polygon points="256.0,46.0 252.0,36.0 256.0,26.0 260.0,36.0" fill="url(#emblemGold)" />
  <polygon points="256.0,466.0 252.0,476.0 256.0,486.0 260.0,476.0" fill="url(#emblemGold)" />
  <polygon points="46.0,256.0 36.0,252.0 26.0,256.0 36.0,260.0" fill="url(#emblemCyan)" />
  <polygon points="466.0,256.0 476.0,252.0 486.0,256.0 476.0,260.0" fill="url(#emblemCyan)" />

  <!-- ================= 2. Symmetrical Momentum Dragon Orbits (对偶势能双环) ================= -->
  <!-- Upper Ascending Momentum Orbit (Cyan Volatility Streamline) -->
  <path d="M 86.0 226.0
           A 195.0 135.0 45 0 1 396.0 111.0"
        fill="none" stroke="url(#emblemCyan)" stroke-width="3.5" stroke-linecap="round" filter="url(#bloomNeon)" />
  
  <circle cx="396.0" cy="111.0" r="5.0" fill="#00F0FF" filter="url(#bloomNeon)" />

  <!-- Lower Counter-Weight Momentum Orbit (Gold Liquidity Streamline) -->
  <path d="M 426.0 286.0
           A 195.0 135.0 45 0 1 116.0 401.0"
        fill="none" stroke="url(#emblemGold)" stroke-width="3.5" stroke-linecap="round" filter="url(#softLaser)" />
  
  <circle cx="116.0" cy="401.0" r="5.0" fill="#F3BA2F" />

  <!-- ================= 3. The Central Volatility Lens / Eye of Probability (核心概率之眼) ================= -->
  <!-- Outer Obsidian Titanium Structural Shell -->
  <path d="M 76.0 256.0
           C 161.0 146.0, 351.0 146.0, 436.0 256.0
           C 351.0 366.0, 161.0 366.0, 76.0 256.0 Z"
        fill="#121720" stroke="#30363D" stroke-width="2.0" />

  <!-- Inner Ambient Lens Gradient Fill -->
  <path d="M 86.0 256.0
           C 166.0 156.0, 346.0 156.0, 426.0 256.0
           C 346.0 356.0, 166.0 356.0, 86.0 256.0 Z"
        fill="url(#singularityAura)" fill-opacity="0.12" />

  <!-- Upper Call Volatility Smile Arch (24K Gold Laser Ridge) -->
  <path d="M 81.0 256.0
           C 166.0 154.0, 346.0 154.0, 431.0 256.0"
        fill="none" stroke="url(#emblemGold)" stroke-width="5.0" stroke-linecap="round" filter="url(#softLaser)" />

  <!-- Lower Put Volatility Smile Arch (Radiant Laser Cyan Ridge) -->
  <path d="M 81.0 256.0
           C 166.0 358.0, 346.0 358.0, 431.0 256.0"
        fill="none" stroke="url(#emblemCyan)" stroke-width="5.0" stroke-linecap="round" filter="url(#bloomNeon)" />

  <!-- Inner Skew Coordinate Graticules (微观概率切线) -->
  <path d="M 121.0 256.0 C 186.0 201.0, 326.0 201.0, 391.0 256.0"
        fill="none" stroke="#E5C07B" stroke-width="1.5" stroke-dasharray="3.0 5.0" opacity="0.65" />
  <path d="M 121.0 256.0 C 186.0 311.0, 326.0 311.0, 391.0 256.0"
        fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3.0 5.0" opacity="0.65" />

  <!-- ================= 4. The Quantum Singularity Pupil (Delta 0.50 奇点准星) ================= -->
  <!-- Ambient Radiant Core Glow -->
  <circle cx="256.0" cy="256.0" r="60.0" fill="url(#singularityAura)" />

  <!-- Titanium Orbit Housing -->
  <circle cx="256.0" cy="256.0" r="44.0" fill="#0A0E14" stroke="#30363D" stroke-width="2.0" />
  
  <!-- Outer GEX Laser Calibration Ring -->
  <circle cx="256.0" cy="256.0" r="35.0" fill="none" stroke="url(#emblemCyan)" stroke-width="3.0" filter="url(#bloomNeon)" />
  <circle cx="256.0" cy="256.0" r="25.0" fill="none" stroke="url(#emblemGold)" stroke-width="1.5" stroke-dasharray="2.0 4.0" />

  <!-- Central Singularity Photon Point -->
  <circle cx="256.0" cy="256.0" r="12.0" fill="#0D1117" stroke="#FFFFFF" stroke-width="2.0" />
  <circle cx="256.0" cy="256.0" r="6.0" fill="#00F0FF" filter="url(#bloomNeon)" />

  <!-- 45° Breakthrough Momentum Vector Piercing Ray (胜负手突破引力箭头) -->
  <line x1="161.0" y1="351.0" x2="371.0" y2="141.0"
        stroke="url(#emblemCyan)" stroke-width="2.5" stroke-linecap="round" filter="url(#bloomNeon)" />
  <polygon points="371.0,141.0 350.0,146.0 366.0,162.0"
           fill="#00F0FF" filter="url(#bloomNeon)" />
</svg>