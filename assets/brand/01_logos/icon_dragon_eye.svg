<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master Metallic 24K Gold Gradient -->
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D0" />
      <stop offset="30%" stop-color="#F3BA2F" />
      <stop offset="75%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#8C6314" />
    </linearGradient>

    <!-- Master Cyan Laser Gradient -->
    <linearGradient id="emblemCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#EAFFFF" />
    </linearGradient>

    <!-- Dark Titanium Hull -->
    <linearGradient id="titaniumHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2530" />
      <stop offset="50%" stop-color="#121720" />
      <stop offset="100%" stop-color="#090C10" />
    </linearGradient>

    <radialGradient id="singularityAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <filter id="bloomNeon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.0" result="blur1" />
      <feGaussianBlur stdDeviation="10.0" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softLaser" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0D1117" rx="61.44"/>

  <!-- ================= 1. Background Quantitative Radar Matrix ================= -->
  <!-- Outer Precision Gauge Rings -->
  <circle cx="256.0" cy="256.0" r="216.0" fill="none" stroke="#30363D" stroke-width="1.5" stroke-opacity="0.8" />
  <circle cx="256.0" cy="256.0" r="192.0" fill="none" stroke="#21262D" stroke-width="1.0" stroke-dasharray="4.0 8.0" />
  <circle cx="256.0" cy="256.0" r="160.0" fill="none" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.4" stroke-dasharray="2.0 6.0" />

  <!-- Coordinate Crosshairs (微观极坐标基准轴) -->
  <line x1="32.0" y1="256.0" x2="480.0" y2="256.0" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.6" stroke-dasharray="4.0 6.0" />
  <line x1="256.0" y1="32.0" x2="256.0" y2="480.0" stroke="#30363D" stroke-width="1.0" stroke-opacity="0.6" stroke-dasharray="4.0 6.0" />

  <!-- Cardinal Precision Diamond Nodes (四向黄金奇点标) -->
  <polygon points="256.0,40.0 252.0,30.0 256.0,22.0 260.0,30.0" fill="url(#emblemGold)" />
  <polygon points="256.0,472.0 252.0,482.0 256.0,490.0 260.0,482.0" fill="url(#emblemGold)" />
  <polygon points="40.0,256.0 30.0,252.0 22.0,256.0 30.0,260.0" fill="url(#emblemCyan)" />
  <polygon points="472.0,256.0 482.0,252.0 490.0,256.0 482.0,260.0" fill="url(#emblemCyan)" />

  <!-- ================= 2. Symmetrical Momentum Dragon Orbits (对偶势能双环) ================= -->
  <!-- Upper Ascending Momentum Orbit (Cyan Volatility Streamline) -->
  <path d="M 101.0 236.0
           C 91.0 96.0, 316.0 61.0, 411.0 136.0"
        fill="none" stroke="url(#emblemCyan)" stroke-width="3.5" stroke-linecap="round" filter="url(#bloomNeon)" />
  
  <circle cx="411.0" cy="136.0" r="5.0" fill="#00F0FF" filter="url(#bloomNeon)" />

  <!-- Lower Counter-Weight Momentum Orbit (Gold Liquidity Streamline) -->
  <path d="M 411.0 276.0
           C 421.0 416.0, 196.0 451.0, 101.0 376.0"
        fill="none" stroke="url(#emblemGold)" stroke-width="3.5" stroke-linecap="round" filter="url(#softLaser)" />
  
  <circle cx="101.0" cy="376.0" r="5.0" fill="#F3BA2F" />

  <!-- ================= 3. The Central Volatility Lens / Eye of Probability (核心概率之眼) ================= -->
  <!-- Outer Obsidian Titanium Structural Shell -->
  <path d="M 91.0 256.0
           C 171.0 161.0, 341.0 161.0, 421.0 256.0
           C 341.0 351.0, 171.0 351.0, 91.0 256.0 Z"
        fill="url(#titaniumHull)" stroke="#30363D" stroke-width="2.0" />

  <!-- Inner Ambient Lens Gradient Fill -->
  <path d="M 101.0 256.0
           C 176.0 171.0, 336.0 171.0, 411.0 256.0
           C 336.0 341.0, 176.0 341.0, 101.0 256.0 Z"
        fill="url(#singularityAura)" fill-opacity="0.1" />

  <!-- Upper Call Volatility Smile Arch (24K Gold Laser Ridge) -->
  <path d="M 96.0 256.0
           C 176.0 166.0, 336.0 166.0, 416.0 256.0"
        fill="none" stroke="url(#emblemGold)" stroke-width="5.0" stroke-linecap="round" filter="url(#softLaser)" />

  <!-- Lower Put Volatility Smile Arch (Radiant Laser Cyan Ridge) -->
  <path d="M 96.0 256.0
           C 176.0 346.0, 336.0 346.0, 416.0 256.0"
        fill="none" stroke="url(#emblemCyan)" stroke-width="5.0" stroke-linecap="round" filter="url(#bloomNeon)" />

  <!-- Inner Skew Coordinate Graticules (微观概率切线) -->
  <path d="M 136.0 256.0 C 196.0 208.0, 316.0 208.0, 376.0 256.0"
        fill="none" stroke="#E5C07B" stroke-width="1.5" stroke-dasharray="3.0 5.0" opacity="0.7" />
  <path d="M 136.0 256.0 C 196.0 304.0, 316.0 304.0, 376.0 256.0"
        fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3.0 5.0" opacity="0.7" />

  <!-- ================= 4. The Quantum Singularity Pupil (Delta 0.50 奇点准星) ================= -->
  <!-- Ambient Radiant Core Glow -->
  <circle cx="256.0" cy="256.0" r="56.0" fill="url(#singularityAura)" />

  <!-- Titanium Orbit Housing -->
  <circle cx="256.0" cy="256.0" r="40.0" fill="#0A0E14" stroke="#30363D" stroke-width="2.0" />
  
  <!-- Outer GEX Laser Calibration Ring -->
  <circle cx="256.0" cy="256.0" r="32.0" fill="none" stroke="url(#emblemCyan)" stroke-width="3.0" filter="url(#bloomNeon)" />
  <circle cx="256.0" cy="256.0" r="22.0" fill="none" stroke="url(#emblemGold)" stroke-width="1.5" stroke-dasharray="2.0 4.0" />

  <!-- Central Singularity Photon Point -->
  <circle cx="256.0" cy="256.0" r="10.0" fill="#0D1117" stroke="#FFFFFF" stroke-width="2.0" />
  <circle cx="256.0" cy="256.0" r="5.0" fill="#00F0FF" filter="url(#bloomNeon)" />

  <!-- 45° Breakthrough Momentum Vector Piercing Ray (胜负手突破引力箭头) -->
  <line x1="171.0" y1="341.0" x2="361.0" y2="151.0"
        stroke="url(#emblemCyan)" stroke-width="2.5" stroke-linecap="round" filter="url(#bloomNeon)" />
  <polygon points="361.0,151.0 342.0,155.0 357.0,170.0"
           fill="#00F0FF" filter="url(#bloomNeon)" />
</svg>