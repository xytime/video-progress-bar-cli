<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>隔离视频号二级回复测试夹具</title></head>
<body>
  <main id="cards">
    <button class="post-card" data-object-id="export/synth_post_other">其他视频</button>
    <button class="post-card" data-object-id="export/synth_video_888">深度解读视频</button>
  </main>
  <section id="detail-host"></section>
  <script>
    window.fixtureState = {mode: 'success', submitClicked: 0};
    const host = document.querySelector('#detail-host');
    document.querySelectorAll('.post-card').forEach(card => card.addEventListener('click', () => {
      const id = card.dataset.objectId;
      host.innerHTML = `
        <article data-current-object-id="${id}">
          <div class="comment-item-main" data-comment-id="synth_cmt_101">
            <span class="nickname">用户大伟</span>
            <p class="content">非常深刻的宏观分析！</p>
            <button type="button" class="reply-btn" data-reply>回复</button>
            <div class="reply-compose" hidden>
              <textarea placeholder="回复用户大伟" data-comment-editor></textarea>
              <button type="button" data-submit>发送</button>
            </div>
            <div class="level-two" data-level-two></div>
          </div>
          <div class="comment-item-main" data-comment-id="synth_cmt_104">
            <span class="nickname">用户老李</span>
            <p class="content">作者之前回复过的评论</p>
            <div class="level-two" data-level-two>
              <div class="sub-comment" data-author-role="author" data-author-id="v2_synthetic_author_finder_id@finder"><span class="author-label">六维时空号(作者)</span> <span data-reply-content>之前已回复过</span></div>
            </div>
          </div>
          <div class="comment-item-main" data-comment-id="synth_cmt_105">
            <span class="nickname">用户小张</span>
            <p class="content">后续页有作者回复的评论</p>
            <button type="button" class="reply-btn" data-reply>回复</button>
            <div class="reply-compose" hidden>
              <textarea placeholder="回复用户小张" data-comment-editor></textarea>
              <button type="button" data-submit>发送</button>
            </div>
            <div class="level-two" data-level-two>
              <div class="sub-comment" data-author-id="other_user@finder"><span class="nickname">路人甲</span> <span>初次可见回复</span></div>
            </div>
            <button type="button" class="show-more-replies" data-action="expand-replies">展开更多回复</button>
          </div>
          <div class="comment-item-main" data-comment-id="synth_cmt_106" data-pagination-status="unknown">
            <span class="nickname">用户小陈</span>
            <p class="content">分页状态未知的评论</p>
            <button type="button" class="reply-btn" data-reply>回复</button>
            <div class="reply-compose" hidden>
              <textarea placeholder="回复用户小陈" data-comment-editor></textarea>
              <button type="button" data-submit>发送</button>
            </div>
            <div class="level-two" data-level-two></div>
          </div>
        </article>`;
      const detail = host.firstElementChild;
      const c1 = detail.querySelector("[data-comment-id='synth_cmt_101']");
      const c105 = detail.querySelector("[data-comment-id='synth_cmt_105']");
      if (c105) {
        const expandBtn = c105.querySelector('[data-action="expand-replies"]');
        if (expandBtn) {
          expandBtn.addEventListener('click', () => {
            const n = document.createElement('div');
            n.className = 'sub-comment';
            n.dataset.commentId = 'synth_reply_subsequent_page_105';
            n.dataset.authorRole = 'author';
            n.dataset.authorId = 'v2_synthetic_author_finder_id@finder';
            n.innerHTML = '<span class="author-label">作者</span> <span data-reply-content>后续页上的作者回复</span>';
            c105.querySelector('[data-level-two]').appendChild(n);
            expandBtn.remove();
          });
        }
      }
      // 服务器持久化的回复（由路由桩注入，页面重新加载后仍存在）；与下方“乐观 DOM 节点”区分
      (window.__serverReplies || []).forEach(r => {
        const n = document.createElement('div');
        n.className = 'sub-comment';
        n.dataset.commentId = r.commentId;
        n.dataset.authorRole = 'author';
        n.dataset.authorId = r.authorId || '';
        n.innerHTML = '<span class="author-label">作者</span> <span data-reply-content></span>';
        n.querySelector('[data-reply-content]').textContent = r.content;
        c1.querySelector('[data-level-two]').appendChild(n);
      });
      c1.querySelector('[data-reply]').addEventListener('click', () => {
        c1.querySelector('.reply-compose').hidden = false;
      });
      c1.querySelector('[data-submit]').addEventListener('click', async () => {
        window.fixtureState.submitClicked++;
        const content = c1.querySelector('textarea').value;
        const mode = window.fixtureState.mode;

        let reqExportId = id;
        let reqRootId = "synth_cmt_101";

        if (mode === 'wrong-export-id') {
          reqExportId = "export/synth_post_wrong";
        }
        if (mode === 'wrong-root-id') {
          reqRootId = "synth_cmt_wrong";
        }

        const payload = {
          exportId: reqExportId,
          rootCommentId: reqRootId,
          replyCommentId: reqRootId,
          content: content,
          clientId: "synth-client-id-123",
          _log_finder_id: "v2_synthetic_author_finder_id@finder"
        };

        if (mode === 'drop-response') {
          fetch('/cgi-bin/mmfinderassistant-bin/comment/create_comment', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(payload)
          }).catch(() => {});
          return;
        }

        try {
          const response = await fetch('/cgi-bin/mmfinderassistant-bin/comment/create_comment', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify(payload)
          });
          const resJson = await response.json();
          if (resJson.errCode === 0) {
            const node = document.createElement('div');
            node.className = "sub-comment";
            node.dataset.commentId = resJson.data.commentId;
            node.dataset.authorRole = 'author';
            node.dataset.authorId = 'v2_synthetic_author_finder_id@finder';
            node.innerHTML = '<span class="author-label">作者</span> <span data-reply-content></span>';
            node.querySelector('[data-reply-content]').textContent = content;
            c1.querySelector('[data-level-two]').appendChild(node);
          }
        } catch (err) {}
      });
    }));
  </script>
</body>
</html>
